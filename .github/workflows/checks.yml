name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm bench
      - run: pnpm build
      - run: pnpm size
      - run: pnpm publint
      - run: pnpm attw
      - run: pnpm smoke
      - run: pnpm smoke:template
      - run: pnpm smoke:peers
      - run: pnpm smoke:builds

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium
            browser: chromium
            projects: --project=chromium
          - name: mobile
            browser: chromium
            projects: --project=mobile
          - name: webkit
            browser: webkit
            projects: --project=webkit
          - name: apple
            browser: webkit
            projects: --project=iphone --project=ipad
          - name: firefox
            browser: firefox
            projects: --project=firefox
    name: e2e (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: |
          version="$(pnpm exec playwright --version | awk '{ print $2 }')"
          test -n "$version"
          . /etc/os-release
          echo "key=playwright-${ID}-${VERSION_ID}-${RUNNER_ARCH}-${version}-${{ matrix.browser }}" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 15
      - if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}
        timeout-minutes: 10
      - run: pnpm exec playwright test ${{ matrix.projects }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: playwright-report/
          retention-days: 14
