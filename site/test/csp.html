<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'nonce-wmkit-e2e'; img-src 'self' data:; require-trusted-types-for 'script'; trusted-types wmkit"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wmkit under a strict content security policy</title>
    <style nonce="wmkit-e2e">
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101218;
        font-family: system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #desktop {
        flex: 1;
        min-height: 0;
      }
      wm-desktop {
        display: block;
        height: 200px;
      }
      #taskbar {
        display: flex;
        gap: 6px;
        min-height: 32px;
      }
      #boxes {
        position: fixed;
        left: 0;
        top: 0;
      }
    </style>
  </head>
  <body>
    <div id="desktop"></div>
    <wm-desktop id="sealed">
      <wm-window window-id="sealed-one" label="Sealed" x="20" y="20" width="240" height="140">
        <p>inside a shadow root</p>
      </wm-window>
    </wm-desktop>
    <div id="taskbar"></div>
    <div id="boxes"></div>
    <script type="module" src="./csp.ts"></script>
  </body>
</html>
